<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; img-src 'self' file: data: blob: https:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'self' file: data: blob: https: wss: ws://127.0.0.1:*; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://w.soundcloud.com" />
  <title>Aurora</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/theme-aurora.css" />
  <style id="user-css"></style>
</head>
<body>
  <!-- start-up animation (removed once Aurora is ready) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-sky"><i></i><i></i><i></i><i></i></div>
    <div class="splash-center">
      <div class="splash-logo">
        <span class="splash-glow"></span>
        <svg viewBox="0 0 24 24" width="112" height="112"><defs><linearGradient id="splg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1ed760"/><stop offset=".55" stop-color="#2de2c9"/><stop offset="1" stop-color="#9b6bff"/></linearGradient></defs><circle cx="12" cy="12" r="11" fill="url(#splg)"/><path class="splash-arc a1" d="M5 16.5c2.2-5.5 4.6-8.8 7-8.8s4.8 3.3 7 8.8" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><path class="splash-arc a2" d="M8.6 16.6c1.2-2.6 2.3-3.9 3.4-3.9s2.2 1.3 3.4 3.9" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="splash-word">Aurora</div>
      <div class="splash-eq"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div id="app" class="app">
    <!-- ===== Top bar ===== -->
    <header class="topbar" id="topbar">
      <div class="topbar-left no-drag">
        <button class="icon-btn" id="btn-menu" title="Menu" data-icon="dots"></button>
        <button class="icon-btn nav-arrow" id="btn-back" title="Go back" data-icon="chevronLeft"></button>
        <button class="icon-btn nav-arrow" id="btn-fwd" title="Go forward" data-icon="chevronRight"></button>
        <button class="brand" id="btn-brand" title="Aurora home"><span class="brand-logo" data-icon="aurora" data-icon-size="26"></span><span class="brand-name">Aurora</span></button>
      </div>
      <div class="topbar-center no-drag">
        <button class="home-btn" id="btn-home" title="Home" data-icon="homeFilled"></button>
        <div class="search-pill" id="search-pill">
          <span class="search-icon" data-icon="search"></span>
          <input id="search-input" type="text" placeholder="Search songs, artists or paste a link" spellcheck="false" autocomplete="off" />
          <span class="search-divider"></span>
          <button class="browse-btn" id="btn-browse" title="Browse" data-icon="browse"></button>
        </div>
      </div>
      <div class="topbar-right no-drag">
        <button class="tb-chip lt-chip" id="lt-chip" hidden><span class="lt-pulse"></span><span class="lt-chip-label">Listening together</span></button>
        <button class="tb-chip update-chip" id="update-chip" hidden><span data-icon="refresh" data-icon-size="14"></span><span class="uc-label">Update</span></button>
        <button class="hub-btn" id="btn-hub" title="Menu"><span class="avatar" id="top-avatar"></span><span class="hub-name" id="hub-name"></span><span class="hub-chev" data-icon="chevronDown" data-icon-size="14"></span><span class="hub-dot" id="hub-dot" hidden></span></button>
      </div>
      <div class="window-controls-space"></div>
    </header>

    <!-- ===== Left: Library ===== -->
    <aside class="panel sidebar" id="sidebar">
      <div class="lib-header">
        <button class="lib-title" id="lib-title" title="Collapse Library">
          <span class="lib-collapsed-icon" data-icon="library"></span>
          <span class="lib-title-text">Library</span>
        </button>
        <div class="lib-header-actions">
          <button class="pill-btn" id="btn-create"><span data-icon="plus"></span><span>Create</span></button>
          <button class="icon-btn small" id="btn-lib-expand" title="Show more" data-icon="expand"></button>
        </div>
      </div>
      <div class="lib-chips" id="lib-chips"></div>
      <div class="lib-tools">
        <div class="lib-search" id="lib-search">
          <button class="icon-btn small" id="btn-lib-search" data-icon="search" title="Search in Library"></button>
          <input id="lib-search-input" placeholder="Search in Library" />
        </div>
        <button class="lib-sort" id="btn-lib-sort"><span id="lib-sort-label">Recents</span><span data-icon="list"></span></button>
      </div>
      <div class="lib-list scroll" id="lib-list"></div>
      <div class="sidebar-resizer" id="sidebar-resizer"></div>
    </aside>

    <!-- ===== Center: main view ===== -->
    <main class="panel main" id="main">
      <div class="main-scroll scroll" id="main-scroll">
        <div class="main-sticky-header" id="main-sticky"></div>
        <div class="view" id="view"></div>
      </div>
    </main>

    <!-- ===== Right: Now playing / Queue ===== -->
    <aside class="panel rightpanel" id="rightpanel">
      <div class="rp-resizer" id="rp-resizer"></div>
      <div class="rp-content scroll" id="rp-content"></div>
    </aside>

    <!-- ===== Bottom: player bar ===== -->
    <footer class="playerbar" id="playerbar">
      <div class="pb-left" id="pb-left"></div>
      <div class="pb-center">
        <div class="pb-controls">
          <button class="icon-btn ctrl" id="btn-shuffle" title="Enable shuffle" data-icon="shuffle"></button>
          <button class="icon-btn ctrl" id="btn-prev" title="Previous" data-icon="prev"></button>
          <button class="play-btn" id="btn-play" title="Play" data-icon="play"></button>
          <button class="icon-btn ctrl" id="btn-next" title="Next" data-icon="next"></button>
          <button class="icon-btn ctrl" id="btn-repeat" title="Enable repeat" data-icon="repeat"></button>
        </div>
        <div class="pb-progress">
          <span class="time" id="time-cur">0:00</span>
          <div class="slider" id="seek"><div class="slider-track"><div class="slider-fill"></div></div><div class="slider-knob"></div></div>
          <span class="time" id="time-total">0:00</span>
        </div>
      </div>
      <div class="pb-right">
        <button class="icon-btn small" id="btn-nowplaying" title="Now playing view" data-icon="nowPlaying"></button>
        <button class="icon-btn small" id="btn-queue" title="Queue" data-icon="queue"></button>
        <button class="icon-btn small" id="btn-device" title="Open file location" data-icon="folder"></button>
        <button class="icon-btn small" id="btn-mute" title="Mute" data-icon="volHigh"></button>
        <div class="slider volume" id="volume"><div class="slider-track"><div class="slider-fill"></div></div><div class="slider-knob"></div></div>
        <button class="icon-btn small" id="btn-mini" title="Open video player" data-icon="miniPlayer"></button>
        <button class="icon-btn small" id="btn-fullscreen" title="Full screen" data-icon="fullscreen"></button>
      </div>
    </footer>
  </div>

  <!-- the single media element: plays audio and video -->
  <div id="media-host" class="media-host"><video id="media" preload="auto" playsinline></video></div>

  <div id="fullscreen-view" class="fullscreen-view hidden"></div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast"></div>
  <input type="file" id="hidden-file" hidden />

  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/collection.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/downloader.js"></script>
  <script src="js/views/discover.js"></script>
  <script src="js/views/friends.js"></script>
  <script src="js/views/friendlib.js"></script>
  <script src="js/views/account.js"></script>
  <script src="js/views/identify.js"></script>
  <script src="js/views/together.js"></script>
  <script src="js/views/transfer.js"></script>
  <script src="js/views/store.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/discord.js"></script>
  <script src="js/mqtt.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/share.js"></script>
  <script src="js/account.js"></script>
  <script src="js/identify.js"></script>
  <script src="js/together.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/discord.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
